services:
  - type: web
    name: novacart-store
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: novacart-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUSINESS_NAME
        value: NovaCart
      - key: BUSINESS_COUNTRY
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: SUPPORT_HOURS
        sync: false
      - key: DEFAULT_LANGUAGE
        value: en
      - key: CURRENCY
        value: USD
      - key: SESSION_DAYS
        value: "30"
      - key: SESSION_IDLE_MINUTES
        value: "1440"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MFA_REQUIRED
        value: "true"
      - key: ADMIN_MFA_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TAX_RATE
        sync: false
      - key: STANDARD_SHIPPING_RATE
        sync: false
      - key: FREE_SHIPPING_THRESHOLD
        sync: false
      - key: EXPRESS_SHIPPING_RATE
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: RETURNS_DAYS
        sync: false
      - key: ORDER_RETURN_WINDOW_DAYS
        sync: false
      - key: ENABLE_OAUTH_GOOGLE
        value: "false"
      - key: ENABLE_OAUTH_APPLE
        value: "false"
      - key: DB_WAIT_TRIES
        value: "60"
      - key: DB_WAIT_DELAY_MS
        value: "2000"
      - key: TRUST_PROXY
        value: "1"
      - key: REMEMBER_DAYS
        value: "1"
      - key: METRICS_TOKEN
        sync: false

databases:
  - name: novacart-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    storageAutoscalingEnabled: true
    connectionPool: pgbouncer
