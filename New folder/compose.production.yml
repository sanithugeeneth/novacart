# Docker Compose 2.24+; run with --env-file .env.production -f compose.production.yml.
# Fixed project name preserves the same data volumes when the release directory changes.
name: novacart-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacart
      POSTGRES_USER: novacart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - production_pg:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacart -d novacart"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://novacart:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/novacart
    depends_on:
      db:
        condition: service_healthy
    expose: ["3000"]
    networks: [backend, edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?Set STORE_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
volumes:
  production_pg:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  edge:
