<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaCart — Reset password</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="auth.css">

<link rel="stylesheet" href="signature-ui.css">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="forma-ui.css"><link rel="stylesheet" href="/motion.css?v=21.9"></head><body class="auth-page" data-design="forma"><div class="auth-shell"><div class="auth-visual"><img class="auth-photo" src="/assets/hero-living.jpg" alt="A warm, sunlit living room"><a class="brand" href="/" aria-label="NovaCart home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 2v28M2 16h28M6.1 6.1l19.8 19.8M6.1 25.9 25.9 6.1" stroke="currentColor" stroke-width="4.5"></path></svg></span><span>NovaCart<span class="brand-dot">.</span></span></a><div class="visual-copy"><span>ACCOUNT SECURITY</span><h1>Choose a<br>new password.</h1><p>Keep your NovaCart account protected with a strong, private password.</p></div></div><div class="auth-panel"><a class="brand mobile-brand" href="/" aria-label="NovaCart home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 2v28M2 16h28M6.1 6.1l19.8 19.8M6.1 25.9 25.9 6.1" stroke="currentColor" stroke-width="4.5"></path></svg></span><span>NovaCart<span class="brand-dot">.</span></span></a><div class="auth-card"><span class="kicker">RESET PASSWORD</span><h2>Set your new password.</h2><form id="reset"><label>New password<div class="pass"><input id="password" type="password" minlength="8" required="" placeholder="8+ chars: letter, number &amp; symbol"><button type="button" id="toggle">Show</button></div></label><button class="primary wide" type="submit">Update password →</button><p class="note">Your reset link expires after 30 minutes.</p><div id="status"></div></form><a href="/login.html" class="back-home">← Back to sign in</a></div></div></div><script>const token=new URLSearchParams(location.search).get('token')||'';const $=s=>document.querySelector(s);$('#toggle').onclick=()=>{$('#password').type=$('#password').type==='password'?'text':'password';$('#toggle').textContent=$('#password').type==='password'?'Show':'Hide'};$('#reset').onsubmit=async e=>{e.preventDefault();$('#status').textContent='Updating password…';try{const r=await fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:$('#password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not reset password.');$('#status').textContent='Password updated. You can sign in now.';setTimeout(()=>location.href='/login.html',900)}catch(err){$('#status').textContent=err.message}}</script>
